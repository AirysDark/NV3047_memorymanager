name: Compile ESP32-S3

on:
  push:
    branches:
      - main
      - memory_manager_overhaul_v1
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 Arduino Core 2.0.17
        run: |
          arduino-cli core install esp32:esp32@2.0.17

      - name: Checkout NV3047 drivers
        uses: actions/checkout@v4
        with:
          repository: AirysDark/NV3047_drivers
          ref: driver_overhaul_v3
          path: external/NV3047_drivers

      - name: Compile include-only automatic runtime
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --library . \
            examples/IncludeOnlyAuto

      - name: Compile MemoryManagerDemo for ESP32-S3
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --library . \
            examples/MemoryManagerDemo

      - name: Compile AdaptiveStressTest for ESP32-S3
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --library . \
            examples/AdaptiveStressTest

      - name: Compile IncludeOnlyTest for ESP32-S3
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --library . \
            examples/IncludeOnlyTest

      - name: Compile DriverTakeoverTest with NV3047 drivers
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --library . \
            --library external/NV3047_drivers \
            examples/DriverTakeoverTest

      - name: Compile DriverTakeoverMemoryFirstTest with NV3047 drivers
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --library . \
            --library external/NV3047_drivers \
            examples/DriverTakeoverMemoryFirstTest
